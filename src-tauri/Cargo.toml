[package]
name = "cindrix-radio"
version = "0.1.0"
edition = "2021"

[lib]
name = "cindrix_radio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
tauri-plugin-dialog = "2"
quick-xml = "0.36"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
lofty = "0.22"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "ogg", "vorbis", "flac", "wav", "pcm", "isomp4"] }
dns-lookup = "2"

[features]
# The YouTube search/download helper (yt-dlp). On in the private build; production builds use
# `--no-default-features` so none of it is compiled in.
default = ["ytdl"]
ytdl = []
