name: build
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run check
      - run: npm run build
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: npx tauri icon public/logo.png
      - name: Fetch yt-dlp to embed in the private build
        shell: bash
        run: |
          mkdir -p src-tauri/ytdlp
          curl -L --fail -o src-tauri/ytdlp/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          test "$(wc -c < src-tauri/ytdlp/yt-dlp.exe)" -gt 1000000
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # production configuration: the YouTube helper must compile out cleanly
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: npx tauri build --no-bundle
      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: Cindrix-Radio-windows-exe
          path: src-tauri/target/release/cindrix-radio.exe
          if-no-files-found: error
          retention-days: 30
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: npx tauri icon public/logo.png
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npx tauri android init --ci
      - name: Add permissions, playback service and storage access
        run: python3 android/patch.py
      - name: Build release APK (arm64)
        run: npx tauri android build --apk --target aarch64 --ci
      - name: Sign with the Cindrix key (so each build installs over the last one)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cindrix.keystore"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned*.apk' | head -1)
          echo "unsigned: $APK"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist-android
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/cindrix.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out dist-android/Cindrix-Radio.apk "$RUNNER_TEMP/aligned.apk"
          unzip -l dist-android/Cindrix-Radio.apk | grep -E "libc\+\+_shared|libcindrix_radio_lib" || { echo "native libraries missing from the APK"; exit 1; }
          "$BT/apksigner" verify --print-certs dist-android/Cindrix-Radio.apk | head -3
          rm -f "$RUNNER_TEMP/cindrix.keystore"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cindrix-Radio-android-apk
          path: dist-android/Cindrix-Radio.apk
          if-no-files-found: error
          retention-days: 30
