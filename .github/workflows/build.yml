name: build
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run check
      - run: npm run build
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: npx tauri icon public/logo.png
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # production configuration: the YouTube helper must compile out cleanly
      - run: cargo check --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: npx tauri build --no-bundle
      - name: Upload Windows exe
        uses: actions/upload-artifact@v4
        with:
          name: Cindrix-Radio-windows-exe
          path: src-tauri/target/release/cindrix-radio.exe
          if-no-files-found: error
          retention-days: 30
